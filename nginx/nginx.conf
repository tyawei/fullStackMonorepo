# 在本地，实际通过compose.yaml配置端口等信息就可以直接访问后端http://localhost:3000
# 不过实际生产部署中，nginx通常是入口，这里配置一下模拟生产环境，在compose.yaml 导入

# 定义上游服务器组：nest
upstream nest_backend {
    server nest:3001       # 容器的服务名:端口
}
# next 前端
upstream next_frontend {
    server next:3000
}

server {
    listen 80;
    server_name localhost;      # 域名/ip

    # 前端请求
    location / {
        proxy_pass http://next_frontend;
        proxy_http_version 1.1;
        # websocket 支持，比如next.js热更新和其他双工通信的业务需要
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 设置传递真是 IP和主机名称等
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forward-For $proxy_add_x_forwarded_for;
        proxy_set_header X_Forward-Proto $scheme;
    }

    # nest 后端（全局前缀为 /api，直接透传）
    location /api/ {
        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X_Real_IP $remote_addr;
        proxy_set_header X_Forwarded_For $Proxy_add_x_forwarded_for;
        proxy_set_header X_Forwarded_Proto $scheme;
    }

    # nest 后端 swagger 地址也可以配置
    location /docs {
        proxy_pass http://nest_backend/docs;
    }
}   